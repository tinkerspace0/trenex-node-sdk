[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "trenex-node-sdk"
version = "0.1.0"
description = "Trenex Node SDK"
authors = [
  { name = "George Gil", email = "georgegil.public@gmail.com" }
]
license = { text = "MIT" }
readme = "README.md"
requires-python = ">=3.8"
dependencies = [
  "numpy",
  "cryptography"
]

[tool.setuptools]
# Use src/ as the root for packages
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]
include = ["trenex_node_sdk*"]
